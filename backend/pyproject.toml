[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainiq"
version = "0.2.0"
description = "Local-first retention intelligence foundation"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "sqlalchemy", "alembic", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[project.scripts]
retainiq-data = "retainiq.data.cli:main"
retainiq-analysis = "retainiq.analysis.cli:main"
