[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainiq"
version = "0.4.0"
description = "Local-first retention intelligence foundation"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "sqlalchemy", "alembic", "httpx", "scikit-learn==1.7.2", "skops==0.13.0", "threadpoolctl==3.8.0"]

[project.optional-dependencies]
boost = ["xgboost==3.0.5", "lightgbm==4.6.0"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[project.scripts]
retainiq-data = "retainiq.data.cli:main"
retainiq-ml = "retainiq.ml.cli:main"
retainiq-analysis = "retainiq.analysis.cli:main"

[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "threadpoolctl", "xgboost", "lightgbm"]
ignore_missing_imports = true
